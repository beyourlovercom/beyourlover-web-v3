<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M06 Feature Gallery — Desktop Interactive Draft</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f5f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
.page{min-height:100vh;padding:70px 0 54px;overflow:hidden}.wrap{width:min(1180px,calc(100% - 56px));margin:auto}
.head{display:flex;align-items:end;justify-content:space-between;gap:40px;margin-bottom:32px}
.kicker{font-size:12px;letter-spacing:.22em;font-weight:800;color:#d94d80;margin-bottom:12px}
h1{font-size:54px;line-height:1.02;letter-spacing:-.045em;margin:0}.lead{font-size:17px;line-height:1.45;color:#6e6e73;max-width:460px;margin:0}
.gallery{position:relative;margin-left:max(28px,calc((100vw - 1180px)/2));display:flex;gap:18px;overflow:visible}
.card{position:relative;height:610px;border-radius:30px;overflow:hidden;transition:width .45s ease,opacity .35s ease,transform .45s ease}
.card.active{width:min(66vw,820px);flex:0 0 auto}.card.next{width:min(30vw,380px);flex:0 0 auto;opacity:.92}
.media{position:absolute;inset:0;background:linear-gradient(145deg,#efeef4,#dcdbe4);transition:opacity .32s ease,transform .45s ease,filter .32s ease}
.card:nth-child(even) .media{background:linear-gradient(145deg,#ddd7ee,#f0eafb)}.media:after{content:"";position:absolute;inset:0}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,transparent 48%,rgba(0,0,0,.62));transition:opacity .3s ease}
.card.expanded .media{opacity:.1;transform:scale(1.03);filter:saturate(.7)}
.card.expanded .scrim{opacity:0}
.copy{position:absolute;left:32px;right:32px;bottom:28px;color:#fff;z-index:2;max-width:560px}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700;opacity:.78;margin-bottom:8px}
.copy h2{font-size:34px;line-height:1.03;letter-spacing:-.035em;margin:0 0 8px}.copy p{font-size:15px;line-height:1.45;color:rgba(255,255,255,.84);margin:0}
.next .copy h2{font-size:25px}.next .copy p{display:none}
.more{position:absolute;right:26px;top:26px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.55);display:grid;place-items:center;color:#fff;font-size:25px;z-index:4;background:rgba(0,0,0,.18);cursor:pointer;transition:transform .25s ease,background .25s ease}
.more.open{transform:rotate(45deg);background:rgba(0,0,0,.38)}
.detail{position:absolute;inset:0;z-index:3;background:linear-gradient(120deg,rgba(249,247,250,.96),rgba(237,231,241,.98));color:#171717;padding:96px 52px 48px;display:flex;flex-direction:column;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s ease}
.card.expanded .detail{opacity:1;pointer-events:auto}.detail .detail-eyebrow{font-size:11px;letter-spacing:.16em;font-weight:800;color:#a44a6c;margin-bottom:14px}.detail .detail-rule{width:50px;height:2px;background:#a44a6c;margin-bottom:22px}.detail h3{font-size:42px;line-height:1.04;letter-spacing:-.035em;margin:0 0 16px}.detail p{font-size:18px;line-height:1.6;color:#55515a;max-width:620px;margin:0}
.nav{display:flex;gap:10px;margin-top:18px}.btn{width:44px;height:44px;border-radius:50%;border:1px solid #d2d2d7;background:#fff;display:grid;place-items:center;font-size:20px;cursor:pointer}.btn:hover{background:#111;color:#fff}
.count{margin-left:8px;align-self:center;color:#86868b;font-size:12px}.note{text-align:center;color:#86868b;font-size:12px;margin-top:12px}
</style></head><body><section class="page">
<div class="wrap"><div class="head"><div><div class="kicker">FEATURE GALLERY</div><h1>Discover More.</h1></div>
<p class="lead">One reusable gallery for feature stories. Click + for detail, or use the arrows to move through features.</p></div></div>
<div class="gallery"><article class="card active" id="activeCard"></article><article class="card next" id="nextCard"></article></div>
<div class="wrap"><div class="nav"><button class="btn" id="prev">←</button><button class="btn" id="next">→</button><div class="count" id="count">01 / 06</div></div>
<div class="note">Naughty Clock Pink · real feature media and verified product copy from the current product source.</div></div>
</section>
<script>
const features=[
{eyebrow:'FEATURE 01',title:'100% Discreet',short:'Discreet payment and packaging keep what is inside private.',detail:'Both payment and packaging are discreet, so there’s no need to worry about anyone knowing what’s inside the box.',image:'https://cdn.shopify.com/s/files/1/0606/8423/9010/files/naughty_clock_pink_more_features_06.jpg?v=1769152391'},
{eyebrow:'FEATURE 02',title:'3 Playful Colors',short:'Choose the color that best suits your nightstand.',detail:'Choose the color that best suits your nightstand. Available in cute pink-yellow, green, or pink.',image:'https://cdn.shopify.com/s/files/1/0606/8423/9010/files/naughty_clock_pink_more_features_04.webp?v=1766383071'},
{eyebrow:'FEATURE 03',title:'App Controlled',short:'Control the toy in real time through the app.',detail:'Whether you’re playing solo or with a partner, control your toys in real time through the app even when you’re miles apart.',image:'https://cdn.shopify.com/s/files/1/0606/8423/9010/files/naughty_clock_pink_more_features_05.webp?v=1766383071'},
{eyebrow:'FEATURE 04',title:'Whisper-Quiet',short:'Designed to keep sound levels under 55 dB.',detail:'Designed with advanced noise-reduction technology to keep sound levels under 55 dB, so your intimate moments stay private.',image:'https://cdn.shopify.com/s/files/1/0606/8423/9010/files/naughty_clock_pink_more_features_03.webp?v=1766383071'},
{eyebrow:'FEATURE 05',title:'Customizable Modes',short:'8 suction modes and 9 vibration modes.',detail:'Features 8 suction modes and 9 vibration modes. Mix and match based on your mood, and take control of your pleasure your way.',image:'https://cdn.shopify.com/s/files/1/0606/8423/9010/files/naughty_clock_pink_more_features_01.webp?v=1766383071'},
{eyebrow:'FEATURE 06',title:'IPX6 Waterproof',short:'Detachable suction and vibrator parts are IPX6 waterproof.',detail:'The detachable parts are IPX6 waterproof, making them easy to rinse and clean. The main device itself is not waterproof.',image:'https://cdn.shopify.com/s/files/1/0606/8423/9010/files/naughty_clock_pink_more_features_02.webp?v=1766383071'}
];
let index=0;
const activeCard=document.getElementById('activeCard'),nextCard=document.getElementById('nextCard'),count=document.getElementById('count');
function cardHTML(f,isActive){
 return '<div class="media" style="background-image:url(&quot;'+f.image+'&quot;);background-size:cover;background-position:center"></div><div class="scrim"></div>'+
 (isActive&&f.detail?'<button class="more" aria-label="Toggle details">＋</button>':'')+
 '<div class="copy"><div class="eyebrow">'+f.eyebrow+'</div><h2>'+f.title+'</h2><p>'+f.short+'</p></div>'+
 (isActive&&f.detail?'<div class="detail"><div class="detail-eyebrow">'+f.eyebrow+'</div><div class="detail-rule"></div><h3>'+f.title+'</h3><p>'+f.detail+'</p></div>':'');
}
function render(){
 const a=features[index],n=features[(index+1)%features.length];
 activeCard.classList.remove('expanded');activeCard.innerHTML=cardHTML(a,true);nextCard.innerHTML=cardHTML(n,false);
 count.textContent=String(index+1).padStart(2,'0')+' / '+String(features.length).padStart(2,'0');
 const more=activeCard.querySelector('.more');
 if(more){more.addEventListener('click',()=>{activeCard.classList.toggle('expanded');more.classList.toggle('open')});}
}
document.getElementById('next').addEventListener('click',()=>{index=(index+1)%features.length;render()});
document.getElementById('prev').addEventListener('click',()=>{index=(index-1+features.length)%features.length;render()});
nextCard.addEventListener('click',()=>{index=(index+1)%features.length;render()});
render();
</script></body></html>
