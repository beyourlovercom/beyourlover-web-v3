<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M03 Product Film — Mobile Design Draft</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f5f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
.page{min-height:100vh;padding:34px 14px 26px;display:flex;align-items:center;justify-content:center}
.wrap{width:100%;max-width:390px;text-align:center}
.kicker{font-size:10px;letter-spacing:.22em;font-weight:800;color:#d94d80;margin-bottom:10px}
h1{font-size:38px;line-height:1.02;letter-spacing:-.045em;margin:0 0 9px}
.lead{font-size:14px;line-height:1.38;color:#6e6e73;max-width:330px;margin:0 auto 20px}
.stage{position:relative;width:100%;aspect-ratio:9/13;border-radius:24px;overflow:hidden;background:
radial-gradient(circle at 65% 35%,rgba(255,153,190,.3),transparent 34%),
linear-gradient(155deg,#111113 0%,#242126 50%,#0c0c0e 100%);
box-shadow:0 16px 45px rgba(0,0,0,.14)}
.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 56%,rgba(0,0,0,.46))}
.film-label{position:absolute;left:16px;top:16px;color:rgba(255,255,255,.72);font-size:9px;font-weight:700;letter-spacing:.14em}
.orbit{position:absolute;left:50%;top:42%;width:260px;height:260px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,159,194,.32),rgba(255,159,194,.08) 45%,transparent 70%)}
.product{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) rotate(-7deg);width:126px;height:170px;border-radius:48% 48% 40% 40%;background:linear-gradient(160deg,#ff9dbc,#f1729c);box-shadow:0 16px 40px rgba(241,114,156,.32)}
.product:after{content:"REAL VIDEO";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(7deg);font-size:9px;font-weight:800;color:rgba(255,255,255,.8);white-space:nowrap}
.play{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.24)}
.play:before{content:"";margin-left:4px;border-left:17px solid #111;border-top:10px solid transparent;border-bottom:10px solid transparent}
.meta{position:absolute;left:16px;right:16px;bottom:16px;text-align:left;color:#fff}
.meta h2{font-size:18px;line-height:1.08;letter-spacing:-.025em;margin:0 0 4px}
.meta p{margin:0;color:rgba(255,255,255,.7);font-size:11px}
.controls{display:flex;gap:7px;margin-top:11px}
.pill{border:1px solid rgba(255,255,255,.38);border-radius:999px;padding:7px 10px;font-size:10px;color:#fff}
.note{margin:14px auto 0;max-width:330px;font-size:11px;line-height:1.35;color:#86868b}
</style>
</head>
<body>
<section class="page"><div class="wrap">
<div class="kicker">PRODUCT FILM</div>
<h1>See It in Motion.</h1>
<p class="lead">A single cinematic moment focused on movement, mood and product feel.</p>
<div class="stage">
<div class="film-label">M03 · MOBILE DRAFT</div>
<div class="orbit"></div><div class="product"></div><div class="play"></div>
<div class="meta"><h2>Naughty Clock Pink</h2><p>Product film · captions available</p><div class="controls"><span class="pill">CC</span><span class="pill">Sound</span><span class="pill">Full screen</span></div></div>
</div>
<div class="note">Design-only placeholder. Real product video/poster replaces the abstract media during implementation.</div>
</div></section>
</body></html>
