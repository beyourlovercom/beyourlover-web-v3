<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M03 鈥?Product Film</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f5f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
.m03{min-height:100vh;padding:68px 28px 56px;display:flex;align-items:center;justify-content:center}
.wrap{width:min(1180px,100%);text-align:center}
.kicker{font-size:12px;letter-spacing:.22em;font-weight:800;color:#d94d80;margin-bottom:14px}
h1{font-size:58px;line-height:1.02;letter-spacing:-.045em;margin:0 0 14px}
.lead{font-size:19px;line-height:1.5;color:#6e6e73;max-width:650px;margin:0 auto 36px}
.stage{position:relative;width:100%;aspect-ratio:16/8.7;border-radius:32px;overflow:hidden;background:#111;box-shadow:0 24px 70px rgba(0,0,0,.12)}
.bgvideo,.mainvideo{position:absolute;inset:0;width:100%;height:100%}
.bgvideo{display:none}.mainvideo{object-fit:cover;background:#111}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 64%,rgba(0,0,0,.38))}
.meta{position:absolute;left:30px;right:30px;bottom:24px;display:flex;justify-content:space-between;align-items:end;text-align:left;color:#fff;pointer-events:none}
.meta h2{font-size:24px;letter-spacing:-.025em;margin:0 0 4px}.meta p{margin:0;color:rgba(255,255,255,.72);font-size:13px}
.badge{border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:8px 12px;font-size:11px;color:#fff}.note{margin-top:18px;font-size:12px;color:#86868b}
@media(max-width:760px){
.m03{padding:34px 12px 24px;min-height:100vh}.wrap{max-width:390px}.kicker{font-size:10px;margin-bottom:10px}
h1{font-size:38px;margin-bottom:9px}.lead{font-size:14px;line-height:1.38;max-width:330px;margin-bottom:18px}
.stage{aspect-ratio:9/13;border-radius:24px}.bgvideo{display:block;object-fit:cover;filter:blur(18px) brightness(.46) saturate(.85);transform:scale(1.12)}
.mainvideo{object-fit:contain;z-index:1;background:transparent}.shade{z-index:2;background:linear-gradient(180deg,transparent 66%,rgba(0,0,0,.52))}
.meta{z-index:3;left:16px;right:16px;bottom:15px;display:block}.meta h2{font-size:18px}.meta p{font-size:11px}
.badge{display:inline-block;margin-top:9px;padding:6px 9px;font-size:10px}.note{font-size:10.5px;line-height:1.35;margin-top:12px}
}
</style></head><body>
<section class="m03"><div class="wrap">
<div class="kicker">PRODUCT FILM</div><h1>See It in Motion.</h1>
<p class="lead">A cinematic product moment focused on movement, mood and product feel.</p>
<div class="stage">
<video class="bgvideo" muted loop autoplay playsinline aria-hidden="true" src="https://img.beyourlover.com/2026/07/29060336/naughty-clock-second-video.mp4"></video>
<video class="mainvideo" controls muted autoplay playsinline preload="metadata" src="https://img.beyourlover.com/2026/07/29060336/naughty-clock-second-video.mp4"></video>
<div class="shade"></div>
<div class="meta"><div><h2>Product Film</h2><p>Single landscape source supported</p></div><span class="badge">Mobile: contain fallback</span></div>
</div><div class="note">One landscape video serves Desktop and Mobile without destructive cropping.</div>
</div></section>
