<!doctype html><html><body><div data-byl-progressive-checkout data-needs-payment="1" data-needs-shipping="1">
<h1 data-byl-checkout-heading>Shipping</h1>
<nav><a data-byl-track="cart">Cart</a><span data-byl-track="shipping">Shipping</span><span data-byl-track="payment">Payment</span></nav>
<form class="checkout woocommerce-checkout">
<section data-byl-step="shipping"><button type="button" data-byl-open-step="shipping"></button>
<div data-byl-account-email-host></div><div data-byl-delivery-options></div>
<div class="byl-checkout-billing">
<div id="billing_first_name_field" class="validate-required"><input id="billing_first_name"></div>
<div id="billing_last_name_field" class="validate-required"><input id="billing_last_name"></div>
<div id="billing_email_field" class="validate-required"><label>Email</label><input type="email" id="billing_email"></div>
<div id="billing_address_1_field" class="validate-required"><input id="billing_address_1"></div>
<div id="billing_city_field" class="validate-required"><input id="billing_city"></div>
<div id="billing_state_field" class="validate-required"><input id="billing_state"></div>
<div id="billing_country_field" class="validate-required"><input id="billing_country"></div>
<div id="billing_postcode_field" class="validate-required"><input id="billing_postcode"></div>
<div id="shipping_phone_field" class="validate-required"><label>Shipping phone </label><input id="shipping_phone"><p id="shipping_phone-description">Delivery only</p></div>
<div id="billing_company_field"><input id="billing_company"></div><div id="billing_address_2_field"><input id="billing_address_2"></div>
</div><div class="woocommerce-additional-fields"><h3>Additional information</h3><div id="order_comments_field"><textarea id="order_comments" name="order_comments"></textarea></div></div><div data-byl-notes-host></div></section>
<section data-byl-step="payment"><button type="button" data-byl-open-step="payment"></button><div data-byl-payment-host></div><div data-byl-terms-host></div></section>
<div><p data-byl-error hidden></p><button type="button" data-byl-next>Continue</button></div>
<aside class="byl-summary-card"><button type="button" data-byl-summary-toggle></button>
<div class="byl-summary-body"><span class="byl-summary-total">$41.00</span><div data-byl-promotion></div>
<div data-byl-review="contact"></div><div data-byl-review="address"></div><div data-byl-review="delivery"></div><div data-byl-review="payment"></div>
<div id="order_review"><table><tbody><tr class="woocommerce-shipping-totals"><td>
<input id="shipping_method_0_flat_rate" type="radio" name="shipping_method[0]" value="flat_rate:1" checked><label for="shipping_method_0_flat_rate">Standard — $10</label>
</td></tr><tr class="order-total"><td><span class="woocommerce-Price-amount">$41.00</span></td></tr></tbody></table>
<div id="payment" class="woocommerce-checkout-payment"><input id="payment_method_test" type="radio" name="payment_method" value="test" checked><label for="payment_method_test">Test Gateway</label>
<div class="place-order"><button id="place_order" type="submit">Place order</button>
<div class="woocommerce-terms-and-conditions-wrapper">
<label class="woocommerce-form__label-for-checkbox"><input type="checkbox" id="terms" name="terms"><span class="woocommerce-terms-and-conditions-checkbox-text">I agree to <a href="/terms" class="woocommerce-terms-and-conditions-link">Terms</a></span></label>
<div class="woocommerce-privacy-policy-text"><p><a href="/privacy">Privacy</a></p></div>
<div class="woocommerce-terms-and-conditions"><p>Legal</p></div></div></div></div></div></div></aside></form></div></body></html>
