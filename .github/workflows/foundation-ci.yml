name: Foundation CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax
        run: find theme platform -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: P1.3 G2 Dev Safety PHP syntax
        run: php -l dev/mu-plugins/byl-dev-safety.php && php -l tools/dev/tests/p13-g2-offline-security-smoke.php
      - name: P1.3 G2 sandbox authorization offline security smoke
        run: php tools/dev/tests/p13-g2-offline-security-smoke.php
      - name: P5 Store API Checkout fail-closed PHP syntax
        run: php -l tools/dev/tests/p5-store-api-checkout-deny-smoke.php
      - name: P5 Store API Checkout fail-closed security smoke
        run: php tools/dev/tests/p5-store-api-checkout-deny-smoke.php
      - name: P7 outbound Dev Sandbox Webhook PHP syntax
        run: php -l tools/dev/tests/p7-sandbox-webhook-isolation-smoke.php
      - name: P7 outbound Dev Sandbox Webhook security smoke
        run: php tools/dev/tests/p7-sandbox-webhook-isolation-smoke.php
      - name: G5 AfterShip/Automizely Dev-only outbound safety syntax
        run: php -l tools/dev/tests/g5-aftership-dev-outbound-isolation-smoke.php
      - name: G5 provider outbound isolation no-network regression
        run: php tools/dev/tests/g5-aftership-dev-outbound-isolation-smoke.php
      - name: P7.1 Thank You PHP syntax
        run: |
          php -l theme/beyourlover-v3/functions.php
          php -l theme/beyourlover-v3/inc/thank-you.php
          php -l theme/beyourlover-v3/inc/thank-you-estimate.php
          php -l theme/beyourlover-v3/woocommerce/checkout/thankyou.php
          php -l tools/dev/tests/p71-thank-you-estimate-smoke.php
      - name: P7.1 delivery estimate holiday regression
        run: php tools/dev/tests/p71-thank-you-estimate-smoke.php
      - name: P7.1 payment title safe text regression
        run: |
          php -l tools/dev/tests/p71-payment-title-smoke.php
          php tools/dev/tests/p71-payment-title-smoke.php
      - name: Default Page/Post template offline regression
        run: php -l tools/dev/tests/page-post-defaults-offline-smoke.php && php tools/dev/tests/page-post-defaults-offline-smoke.php
      - name: Blog TOC offline source and script syntax regression
        run: node --check theme/beyourlover-v3/assets/js/post-toc.js && node scripts/test_blog_toc_contract.js
      - name: Blog product-card legacy Woo shortcode offline regression
        run: php -l theme/beyourlover-v3/inc/blog-product-card.php && php -l tools/dev/tests/blog-product-card-offline-smoke.php && php tools/dev/tests/blog-product-card-offline-smoke.php
      - name: Python syntax
        run: python -m py_compile scripts/*.py
      - name: Theme OS V1 module, SemVer and dependency validation
        run: python3 scripts/theme_os.py validate
      - name: Theme OS V1 fail-closed contracts
        run: python3 -m unittest discover -s scripts -p test_theme_os_contract.py -v
      - name: Theme OS V1 reproducible ZIP (CI evidence, no deploy)
        run: |
          mkdir -p "$RUNNER_TEMP/byl-os-a" "$RUNNER_TEMP/byl-os-b"
          python3 scripts/theme_os.py build --out-dir "$RUNNER_TEMP/byl-os-a"
          python3 scripts/theme_os.py build --out-dir "$RUNNER_TEMP/byl-os-b"
          A=$(find "$RUNNER_TEMP/byl-os-a" -maxdepth 1 -name '*.zip' -print -quit)
          B=$(find "$RUNNER_TEMP/byl-os-b" -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$A" && test -n "$B"
          test "$(sha256sum "$A" | cut -d' ' -f1)" = "$(sha256sum "$B" | cut -d' ' -f1)"
          python3 scripts/theme_os.py verify --zip "$A" --receipt "${A%.zip}.receipt.json"
          echo "Theme ZIP reproducibility verified; no release or deployment."
      - name: Cart V2 focused regression
        run: php scripts/test_cart_v2_contract.php
      - name: Cart final quantity and fragment regression
        run: node scripts/test_cart_quantity_refresh_c1c4.js
      - name: Cart to Checkout native handoff contract
        run: node scripts/test_cart_checkout_handoff_c1c4.js
      - name: Cart native Woo shipping-zone parity regression
        run: php scripts/test_cart_promotion_native_authority.php
      - name: Free Shipping landing page contract
        run: php scripts/test_free_shipping_page.php
      - name: Cart coupon UI and native fallback
        run: node scripts/test_cart_coupon_ui.js
      - name: Cart V3 canonical brand tokens
        run: node scripts/test_cart_vi_tokens.js
      - name: Checkout Secure Shell V1 contract
        run: node scripts/test_checkout_secure_shell.js
      - name: Migration IDs
        run: python scripts/check_migration_ids.py
      - name: Shipping promotion contract
        run: python scripts/test_shipping_promotion_contract.py
      - name: Shipping promotion runtime contract
        run: python scripts/test_shipping_promotion_runtime_contract.py
      - name: Checkout shipping promotion docs
        run: python scripts/test_checkout_shipping_promotion_docs.py
      - name: Cart promotion UX contract
        run: python scripts/test_cart_promotion_ux_contract.py
      - name: Checkout progressive UX contract
        run: python scripts/test_checkout_progressive_ux_contract.py
